# Render Free web service. NOT applied as a Blueprint (Blueprints are paid on
# this account): the service is created by hand in the dashboard with exactly these settings, and
# this file is the record to keep them in sync with. Secret values are entered in the dashboard and
# never committed. Migrations and operator commands run locally, not on Render.
services:
  - type: web
    name: envoi
    runtime: node
    plan: free
    # Next to Neon's aws-us-east-2, so database round trips stay in-region (R12 measures the rest).
    region: ohio
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      # Generated once by the operator, entered by hand and never rotated per deploy, so sessions
      # survive a redeploy.
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: ENVOI_ENVIRONMENT
        value: sandbox
      - key: LOG_LEVEL
        value: info
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # PayPal sandbox REST app (S2). Secret values are entered by hand; the API host is a code
      # constant on a sandbox-only allowlist, so no variable can point the app at live PayPal.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_PARTNER_ATTRIBUTION_ID
        sync: false
      # Set now so S3 needs no Render change; the app reads it from S3 (webhook verification).
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Kill switch for new PayPal starts and captures (D10): "true" or "false", entered by hand.
      - key: PAYMENTS_ENABLED
        sync: false
      # OpenAI (S4 text suggestions, S11 menu photos). The key is entered by hand. AI_MODEL is the
      # S4 evaluation's choice; AI_MENU_MODEL is the S11 vision evaluation's choice and needs a
      # reviewed bounds entry in MENU_SPEND_POLICY, or every import is refused.
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_MENU_MODEL
        sync: false
      # Kill switch for menu photo imports (S11): "true" or "false", entered by hand; unset is false.
      - key: MENU_IMPORTS_ENABLED
        sync: false
