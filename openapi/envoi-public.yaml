{
  "openapi": "3.1.0",
  "info": {
    "title": "Envoi public API",
    "version": "2.0.0",
    "description": "Hand-written description of Envoi's public API: two read routes, the list of published shops and one shop's published menu, and the agent's purchase request route. Envoi is a test environment: shops marked isDemoFixture are seeded demo fixtures, and payments use PayPal sandbox test money only. The purchase request route needs an agent token and answers a one-time link that a human buyer opens to review Envoi's price and approve payment themselves. Nothing in this API pays, approves or prices a purchase or reads a receipt; a buyer's price is always recalculated by Envoi at review. Prices are whole Singapore cents, and an unknown price or availability is null, never zero or false. This file is written in JSON syntax, which is valid YAML 1.2, so it can be read without a YAML library. The envelope flag ok and the error flag retryable are typed boolean without a literal value because the APIMatic TypeScript generator (CLI 2.0.0-beta.6, codegen v4) turns a boolean enum or const into the string \"True\" or \"False\"."
  },
  "servers": [
    { "url": "https://envoi-helx.onrender.com", "description": "Render test deployment" },
    { "url": "http://localhost:3100", "description": "Local test server" }
  ],
  "paths": {
    "/api/v1/outlets": {
      "get": {
        "operationId": "listOutlets",
        "summary": "List published shops",
        "description": "Returns up to 50 shops that have a published, confirmed menu, ordered by name and then id. A shop without a published menu is not listed.",
        "tags": ["Outlets"],
        "responses": {
          "200": {
            "description": "The published shops.",
            "headers": { "Cache-Control": { "$ref": "#/components/headers/PublicShortCache" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/OutletListResponse" } } }
          }
        }
      }
    },
    "/api/v1/outlets/{id}/menu": {
      "get": {
        "operationId": "getOutletMenu",
        "summary": "Read a shop's published menu",
        "description": "Returns the shop and the items of its published, confirmed menu revision in menu order. An unknown shop and a shop without a published menu both answer 404 not_found, so they cannot be told apart.",
        "tags": ["Outlets"],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "description": "The shop id, as listed by listOutlets. Any other value answers 404 not_found, like an unknown shop.",
            "schema": { "type": "string" }
          }
        ],
        "responses": {
          "200": {
            "description": "The shop's published menu.",
            "headers": { "Cache-Control": { "$ref": "#/components/headers/PublicShortCache" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/MenuResponse" } } }
          },
          "404": {
            "description": "The shop is unknown, the id is not a shop id, or the shop has no published menu.",
            "headers": { "Cache-Control": { "$ref": "#/components/headers/NoStore" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/NotFoundResponse" } } }
          }
        }
      }
    },
    "/api/v1/purchase-requests": {
      "post": {
        "operationId": "createPurchaseRequest",
        "summary": "Propose a basket and get a link for a buyer",
        "description": "An agent holding an Envoi agent token proposes one shop's items and quantities. Envoi checks the basket against the shop's published menu and answers a link that works once and expires 10 minutes after it is created. The buyer opens the link, reviews the price Envoi calculates and approves payment themselves. The answer carries no price, purchase id or payment authority. Fields other than outletId and lines, such as a price, total or payee, are dropped and never priced or stored.",
        "tags": ["Purchase requests"],
        "security": [{ "agentBearer": [] }],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PurchaseRequestBody" } } }
        },
        "responses": {
          "201": {
            "description": "The link for the buyer.",
            "headers": { "Cache-Control": { "$ref": "#/components/headers/NoStore" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PurchaseRequestCreatedResponse" } } }
          },
          "400": {
            "description": "The body is not JSON, is over 4 KiB, or does not name a shop and 1 to 20 lines; or the basket does not fit the shop's published menu, such as an unknown, unpriced or unavailable item, a repeated item or a quantity outside 1 to 20, or the shop has no PayPal sandbox seller connected.",
            "headers": { "Cache-Control": { "$ref": "#/components/headers/NoStore" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ValidationFailedResponse" } } }
          },
          "401": {
            "description": "No agent token was sent, or the token is unknown or revoked.",
            "headers": { "Cache-Control": { "$ref": "#/components/headers/NoStore" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/UnauthorizedResponse" } } }
          },
          "404": {
            "description": "The shop is unknown or has no published menu.",
            "headers": { "Cache-Control": { "$ref": "#/components/headers/NoStore" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/NotFoundResponse" } } }
          }
        }
      }
    }
  },
  "components": {
    "headers": {
      "PublicShortCache": {
        "description": "Public read, cacheable for 30 seconds.",
        "required": true,
        "schema": { "type": "string", "enum": ["public, max-age=30"] }
      },
      "NoStore": {
        "description": "Never cached: every error answer and the purchase request link.",
        "required": true,
        "schema": { "type": "string", "enum": ["no-store"] }
      }
    },
    "securitySchemes": {
      "agentBearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "An Envoi agent token, issued by the Envoi operator and shown once. It can propose a basket only: it cannot pay, approve a payment or read a receipt."
      }
    },
    "schemas": {
      "OutletSummary": {
        "type": "object",
        "additionalProperties": false,
        "required": ["id", "name", "area", "isDemoFixture", "country", "currency"],
        "properties": {
          "id": { "type": "string", "pattern": "^out_[a-z2-7]{26}$" },
          "name": { "type": "string" },
          "area": { "type": "string" },
          "isDemoFixture": { "type": "boolean", "description": "True for a seeded demo fixture shop, which is not a real business." },
          "country": { "$ref": "#/components/schemas/Country" },
          "currency": { "$ref": "#/components/schemas/Currency" }
        }
      },
      "Country": { "type": "string", "enum": ["SG", "US"], "description": "The shop's country: Singapore or the United States. It sets the shop's currency and cannot change after the shop publishes." },
      "Currency": { "type": "string", "enum": ["SGD", "USD"], "description": "ISO 4217 code of every price at this shop: SGD for a Singapore shop, USD for a United States shop. Both have two decimal places, so 100 minor units are 1.00." },
      "MenuItem": {
        "type": "object",
        "additionalProperties": false,
        "required": ["id", "name", "unitMinor", "available"],
        "properties": {
          "id": { "type": "string", "pattern": "^itm_[a-z2-7]{26}$" },
          "name": { "type": "string" },
          "unitMinor": { "type": ["integer", "null"], "minimum": 1, "description": "Unit price in minor units of the menu's currency (cents), at least 1; null when the price is unknown. A menu is confirmed only with every price known, so a published menu currently never carries null." },
          "available": { "type": ["boolean", "null"], "description": "Merchant-supplied availability; null when unknown. A menu is confirmed only with every availability known, so a published menu currently never carries null." }
        }
      },
      "OutletList": {
        "type": "object",
        "additionalProperties": false,
        "required": ["outlets"],
        "properties": {
          "outlets": { "type": "array", "items": { "$ref": "#/components/schemas/OutletSummary" } }
        }
      },
      "Menu": {
        "type": "object",
        "additionalProperties": false,
        "required": ["outlet", "menuRevisionId", "currency", "items"],
        "properties": {
          "outlet": { "$ref": "#/components/schemas/OutletSummary" },
          "menuRevisionId": { "type": "string", "pattern": "^mrv_[a-z2-7]{26}$" },
          "currency": { "$ref": "#/components/schemas/Currency" },
          "items": { "type": "array", "items": { "$ref": "#/components/schemas/MenuItem" } }
        }
      },
      "OutletListResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": ["ok", "data"],
        "properties": {
          "ok": { "type": "boolean", "description": "Always true on a 200 answer." },
          "data": { "$ref": "#/components/schemas/OutletList" }
        }
      },
      "MenuResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": ["ok", "data"],
        "properties": {
          "ok": { "type": "boolean", "description": "Always true on a 200 answer." },
          "data": { "$ref": "#/components/schemas/Menu" }
        }
      },
      "NotFoundResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": ["ok", "error"],
        "properties": {
          "ok": { "type": "boolean", "description": "Always false on an error answer." },
          "error": {
            "type": "object",
            "additionalProperties": false,
            "required": ["code", "message", "retryable", "details"],
            "properties": {
              "code": { "type": "string", "enum": ["not_found"] },
              "message": { "type": "string" },
              "retryable": { "type": "boolean", "description": "False: repeating the same request gives the same answer." },
              "details": { "type": "object", "additionalProperties": false, "properties": {} }
            }
          }
        }
      },
      "PurchaseLine": {
        "type": "object",
        "additionalProperties": false,
        "required": ["menuItemId", "quantity"],
        "properties": {
          "menuItemId": { "type": "string", "description": "An item id from getOutletMenu." },
          "quantity": { "type": "integer", "minimum": 1, "description": "Whole number from 1 to 20." }
        }
      },
      "PurchaseRequestBody": {
        "type": "object",
        "additionalProperties": false,
        "required": ["outletId", "lines"],
        "properties": {
          "outletId": { "type": "string", "description": "A shop id from listOutlets." },
          "lines": { "type": "array", "items": { "$ref": "#/components/schemas/PurchaseLine" }, "description": "1 to 20 lines, each item at most once." }
        }
      },
      "PurchaseRequestCreated": {
        "type": "object",
        "additionalProperties": false,
        "required": ["url", "expiresAt"],
        "properties": {
          "url": { "type": "string", "pattern": "^https?://[^/]+/approve/[a-z2-7]{52}$", "description": "The one-time link for the buyer to open. It is not payment authority." },
          "expiresAt": { "type": "string", "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$", "description": "When the link stops working, as an ISO 8601 UTC time, 10 minutes after it was created." }
        }
      },
      "PurchaseRequestCreatedResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": ["ok", "data"],
        "properties": {
          "ok": { "type": "boolean", "description": "Always true on a 201 answer." },
          "data": { "$ref": "#/components/schemas/PurchaseRequestCreated" }
        }
      },
      "ValidationFailedResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": ["ok", "error"],
        "properties": {
          "ok": { "type": "boolean", "description": "Always false on an error answer." },
          "error": {
            "type": "object",
            "additionalProperties": false,
            "required": ["code", "message", "retryable", "details"],
            "properties": {
              "code": { "type": "string", "enum": ["validation_failed"] },
              "message": { "type": "string" },
              "retryable": { "type": "boolean", "description": "False: the same body gives the same answer until the body or the shop's menu changes." },
              "details": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "reason": {
                    "type": "string",
                    "enum": ["too_large", "timeout", "aborted", "line_count", "duplicate_item", "quantity", "unknown_item", "price_unknown", "unavailable", "no_destination"],
                    "description": "Present when Envoi can name the problem: a body too large, too slow or aborted; or the basket's line count, a repeated item, a quantity, an unknown, unpriced or unavailable item, or no connected PayPal sandbox seller."
                  }
                }
              }
            }
          }
        }
      },
      "UnauthorizedResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": ["ok", "error"],
        "properties": {
          "ok": { "type": "boolean", "description": "Always false on an error answer." },
          "error": {
            "type": "object",
            "additionalProperties": false,
            "required": ["code", "message", "retryable", "details"],
            "properties": {
              "code": { "type": "string", "enum": ["unauthorized"] },
              "message": { "type": "string" },
              "retryable": { "type": "boolean", "description": "False: send a valid agent token." },
              "details": { "type": "object", "additionalProperties": false, "properties": {} }
            }
          }
        }
      }
    }
  }
}
